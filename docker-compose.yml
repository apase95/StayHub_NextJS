services:
  db:
    image: postgres:16-alpine
    container_name: stayhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stayhub_db
    ports:
      - "5432:5432"
    volumes:
      - stayhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub -d stayhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stayhub_postgres_data:
